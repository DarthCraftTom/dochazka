<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Příchody pedagogů</title>
    <link rel="icon" type="image/png" href="brambora.png">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">

    <!-- Speciální podpora pro iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Příchody">
    <link rel="apple-touch-icon" href="brambora.png">
    <!-- Načtení Chart.js pro graf -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Tmavý režim jako výchozí */
            --primary: #6366F1;
            --bg: #111827;
            --surface: #1F2937;
            --text: #F9FAFB;
            --border: #374151;
        }

        /* Třída pro světlý režim */
        .light-mode {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --text: #1F2937;
            --border: #D1D5DB;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: flex-start;
        }
        .form-section, .chart-section, .stopwatch-section {
            background-color: var(--surface);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex: 1;
            min-width: 300px;
            transition: background-color 0.3s;
        }
        h2 { margin-top: 0; color: var(--text); }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text);
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: var(--bg);
            color: var(--text);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #4338CA; }
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .success { background-color: #065F46; color: #D1FAE5; }
        .error { background-color: #991B1B; color: #FEE2E2; }

        /* Styly pro stopky */
        .stopwatch-display {
            font-size: 3em;
            text-align: center;
            font-family: monospace;
            margin-bottom: 20px;
            color: var(--primary);
        }
        .stopwatch-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stopwatch-controls button {
            flex: 1;
        }
        #transferTimeBtn {
            background-color: #10B981;
        }
        #transferTimeBtn:hover {
            background-color: #059669;
        }

        /* Styly pro tabulku */
        .table-section {
            background-color: var(--surface);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex: 1 1 100%;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .table-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: var(--bg);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Stopky -->
    <div class="stopwatch-section">
        <h2>Stopky</h2>
        <div class="stopwatch-display" id="display">00:00:00</div>
        <div class="stopwatch-controls">
            <button id="startStopBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>
        <button id="transferTimeBtn" disabled>Přenést čas do formuláře</button>
    </div>

    <!-- Formulář -->
    <div class="form-section">
        <h2>Záznam příchodu</h2>
        <form id="arrivalForm">
            <div class="form-group">
                <label for="teacher">Pedagog</label>
                <select id="teacher" required>
                    <option value="" disabled selected>Vyberte učitele...</option>
                    <option value="Bouchalová">Bouchalová</option>
                    <option value="Juhasová">Juhasová</option>
                    <option value="Bednář">Bednář</option>
                    <option value="Bartošová">Bartošová</option>
                    <option value="Daněk">Daněk</option>
                    <option value="Zelinová">Zelinová</option>
                    <option value="Janko">Janko</option>
                    <option value="Novotná">Novotná</option>
                    <option value="Glézl">Glézl</option>
                    <option value="Staněk">Staněk</option>
                    <option value="Trochta">Trochta</option>
                    <option value="Bartoš">Bartoš</option>
                    <option value="Wisman">Wisman</option>
                </select>
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="minutes">Minuty</label>
                    <input type="number" id="minutes" min="0" value="0" required>
                </div>
                <div style="flex: 1;">
                    <label for="seconds">Sekundy</label>
                    <input type="number" id="seconds" min="0" max="59" value="0" required>
                </div>
            </div>
            <button type="submit" id="submitBtn">Odeslat</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- Graf -->
    <div class="chart-section">
        <h2>Přehled (od nejpozdějšího)</h2>
        <canvas id="myChart"></canvas>
    </div>

    <!-- Tabulka historie -->
    <div class="table-section">
        <h2>Historie záznamů</h2>
        <div class="table-controls">
            <div style="flex: 1; min-width: 200px;">
                <label for="filterTeacher">Filtr - Učitel:</label>
                <select id="filterTeacher">
                    <option value="all">Všichni učitelé</option>
                    <option value="Bouchalová">Bouchalová</option>
                    <option value="Juhasová">Juhasová</option>
                    <option value="Bednář">Bednář</option>
                    <option value="Bartošová">Bartošová</option>
                    <option value="Daněk">Daněk</option>
                    <option value="Zelinová">Zelinová</option>
                    <option value="Janko">Janko</option>
                    <option value="Novotná">Novotná</option>
                    <option value="Glézl">Glézl</option>
                    <option value="Staněk">Staněk</option>
                    <option value="Trochta">Trochta</option>
                    <option value="Bartoš">Bartoš</option>
                    <option value="Wisman">Wisman</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label for="sortRecords">Řazení:</label>
                <select id="sortRecords">
                    <option value="dateDesc">Datum (od nejnovějšího)</option>
                    <option value="dateAsc">Datum (od nejstaršího)</option>
                    <option value="timeDesc">Zpoždění (od největšího)</option>
                    <option value="timeAsc">Zpoždění (od nejmenšího)</option>
                </select>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table id="recordsTable">
                <thead>
                    <tr>
                        <th>Datum a čas</th>
                        <th>Pedagog</th>
                        <th>Zpoždění</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data tabulky se načtou dynamicky -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Firebase SDK a logika (ES Modules) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyClGPUE8Dr2pzYoxFSRuO3zRWkQZGztcsM",
        authDomain: "dochazka-2b9ae.firebaseapp.com",
        projectId: "dochazka-2b9ae",
        storageBucket: "dochazka-2b9ae.firebasestorage.app",
        messagingSenderId: "105090704625",
        appId: "1:105090704625:web:c14ac1831f20c1733cb550"
    };

    // Inicializace
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Globální proměnné
    let arrivalChart = null;
    let allRecords = [];

    // Elementy
    const form = document.getElementById('arrivalForm');
    const messageDiv = document.getElementById('message');
    const btn = document.getElementById('submitBtn');
    
    // --- STOPKY LOGIKA ---
    let startTime;
    let elapsedTime = 0;
    let timerInterval;
    let isRunning = false;

    const display = document.getElementById('display');
    const startStopBtn = document.getElementById('startStopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const transferTimeBtn = document.getElementById('transferTimeBtn');
    const formMinutesInput = document.getElementById('minutes');
    const formSecondsInput = document.getElementById('seconds');

    function formatTime(time) {
        let date = new Date(time);
        let m = date.getUTCMinutes().toString().padStart(2, '0');
        let s = date.getUTCSeconds().toString().padStart(2, '0');
        let ms = Math.floor(date.getUTCMilliseconds() / 10).toString().padStart(2, '0');
        return `${m}:${s}:${ms}`;
    }

    function updateDisplay() {
        display.textContent = formatTime(elapsedTime);
    }

    startStopBtn.addEventListener('click', () => {
        if (!isRunning) {
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateDisplay();
            }, 10);
            startStopBtn.textContent = 'Stop';
            isRunning = true;
            transferTimeBtn.disabled = true;
        } else {
            clearInterval(timerInterval);
            startStopBtn.textContent = 'Start';
            isRunning = false;
            transferTimeBtn.disabled = false;
        }
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(timerInterval);
        elapsedTime = 0;
        updateDisplay();
        startStopBtn.textContent = 'Start';
        isRunning = false;
        transferTimeBtn.disabled = true;
    });

    transferTimeBtn.addEventListener('click', () => {
        let date = new Date(elapsedTime);
        let m = date.getUTCMinutes();
        let s = date.getUTCSeconds();
        
        formMinutesInput.value = m;
        formSecondsInput.value = s;
        
        const originalText = transferTimeBtn.textContent;
        transferTimeBtn.textContent = "Přeneseno!";
        setTimeout(() => { transferTimeBtn.textContent = originalText; }, 1500);
    });

    // --- AUTOMATICKÉ ZAPNUTÍ STOPEK DLE ZVONĚNÍ ---
    const bellTimes = ["08:00", "08:55", "10:00", "10:55", "11:50", "12:45", "13:35", "14:30", "15:20"];
    let lastCheckedMinute = "";

    setInterval(() => {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const currentTimeStr = `${hours}:${minutes}`;

        if (currentTimeStr !== lastCheckedMinute) {
            lastCheckedMinute = currentTimeStr;
            if (bellTimes.includes(currentTimeStr)) {
                if (!isRunning) {
                    startStopBtn.click();
                }
            }
        }
    }, 1000);

    // --- ODESLÁNÍ DO FIRESTORE ---
    function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = type;
        messageDiv.style.display = 'block';
        setTimeout(() => messageDiv.style.display = 'none', 3000);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Odesílám...";

        const teacher = document.getElementById('teacher').value;
        const minutes = parseInt(document.getElementById('minutes').value);
        const seconds = parseInt(document.getElementById('seconds').value);
        const totalSeconds = (minutes * 60) + seconds;

        try {
            await addDoc(collection(db, "arrivals"), {
                teacher: teacher,
                minutes: minutes,
                seconds: seconds,
                totalSeconds: totalSeconds,
                timestamp: new Date()
            });
            showMessage('Úspěšně odesláno!', 'success');
            form.reset();
            document.getElementById('minutes').value = 0;
            document.getElementById('seconds').value = 0;
            
            // Automatický reset stopek po odeslání
            if (isRunning) {
                startStopBtn.click();
            }
            resetBtn.click();

            await loadChartData();
        } catch (error) {
            console.error("Chyba při zápisu: ", error);
            showMessage('Chyba při odesílání: ' + error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = "Odeslat";
        }
    });

    // --- NAČTENÍ DAT PRO GRAF A TABULKU ---
    async function loadChartData() {
        const querySnapshot = await getDocs(collection(db, "arrivals"));
        const teacherData = {};
        allRecords = []; 

        querySnapshot.forEach((doc) => {
            const data = doc.data();
            let recordDate = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp || Date.now());
            
            allRecords.push({
                id: doc.id,
                teacher: data.teacher,
                minutes: data.minutes,
                seconds: data.seconds,
                totalSeconds: data.totalSeconds,
                timestamp: recordDate
            });

            if (!teacherData[data.teacher]) {
                teacherData[data.teacher] = { totalSec: 0, count: 0 };
            }
            teacherData[data.teacher].totalSec += data.totalSeconds;
            teacherData[data.teacher].count += 1;
        });

        renderTable();

        const averages = [];
        for (const [name, stats] of Object.entries(teacherData)) {
            averages.push({
                name: name,
                avgSeconds: Math.round(stats.totalSec / stats.count)
            });
        }
        averages.sort((a, b) => b.avgSeconds - a.avgSeconds);

        const labels = averages.map(a => a.name);
        const dataValues = averages.map(a => a.avgSeconds);
        renderChart(labels, dataValues);
    }

    // --- LOGIKA TABULKY ---
    const filterTeacherSelect = document.getElementById('filterTeacher');
    const sortRecordsSelect = document.getElementById('sortRecords');
    const tableBody = document.getElementById('tableBody');

    function renderTable() {
        const filterValue = filterTeacherSelect.value;
        const sortValue = sortRecordsSelect.value;

        let displayData = allRecords;
        if (filterValue !== "all") {
            displayData = displayData.filter(record => record.teacher === filterValue);
        }

        displayData.sort((a, b) => {
            if (sortValue === "dateDesc") return b.timestamp - a.timestamp;
            if (sortValue === "dateAsc") return a.timestamp - b.timestamp;
            if (sortValue === "timeDesc") return b.totalSeconds - a.totalSeconds;
            if (sortValue === "timeAsc") return a.totalSeconds - b.totalSeconds;
            return 0;
        });

        tableBody.innerHTML = "";
        displayData.forEach(record => {
            const tr = document.createElement('tr');
            const dateStr = record.timestamp.toLocaleString('cs-CZ', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });

            tr.innerHTML = `
                <td>${dateStr}</td>
                <td>${record.teacher}</td>
                <td>${record.minutes} min ${record.seconds} s</td>
            `;
            tableBody.appendChild(tr);
        });
    }

    filterTeacherSelect.addEventListener('change', renderTable);
    sortRecordsSelect.addEventListener('change', renderTable);

    // --- VYKRESLENÍ GRAFU ---
    function renderChart(labels, dataValues) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if (arrivalChart) arrivalChart.destroy();

        arrivalChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Průměrné zpoždění (v sekundách)',
                    data: dataValues,
                    backgroundColor: 'rgba(99, 102, 241, 0.5)', 
                    borderColor: 'rgba(99, 102, 241, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Sekundy celkem', color: '#F9FAFB' },
                        ticks: { color: '#F9FAFB' },
                        grid: { color: '#374151' }
                    },
                    x: {
                        ticks: { color: '#F9FAFB' },
                        grid: { color: '#374151' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#F9FAFB' } }
                }
            }
        });
    }

    // Spuštění po načtení
    loadChartData();
</script>

<!-- PWA Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(registration => console.log('SW registrován'))
                .catch(err => console.log('SW chyba: ', err));
        });
    }
</script>
    
</body>
</html>
